<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>台灣美食地圖 — 全台餐廳推薦與食記收藏</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700;900&display=swap');
:root {
  --primary:#FF6B35;--primary-light:#FF8F65;--primary-dark:#E5531F;
  --bg:#F8F6F3;--card:#FFFFFF;--text:#1A1A2E;--text-sec:#6B7280;
  --border:#E5E7EB;--shadow:0 4px 24px rgba(0,0,0,0.06);
  --north:#2563EB;--central:#059669;--south:#DC2626;--east:#7C3AED;--island:#0891B2;
  --glass:rgba(255,255,255,0.72);--blur:saturate(180%) blur(16px);
  --radius:16px;--radius-sm:10px;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:'Noto Sans TC',system-ui,sans-serif;background:var(--bg);color:var(--text);line-height:1.7;-webkit-font-smoothing:antialiased;}
::selection{background:var(--primary);color:#fff;}

/* ── Hero ── */
.hero{position:relative;background:linear-gradient(135deg,#1A1A2E 0%,#16213E 40%,#0F3460 100%);color:#fff;padding:3rem 1.5rem 2rem;text-align:center;overflow:hidden;}
.hero::before{content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;background:radial-gradient(circle at 30% 50%,rgba(255,107,53,0.15) 0%,transparent 50%),radial-gradient(circle at 70% 80%,rgba(8,145,178,0.12) 0%,transparent 40%);animation:heroShimmer 8s ease-in-out infinite alternate;}
@keyframes heroShimmer{0%{transform:translate(0,0)}100%{transform:translate(-3%,2%)}}
.hero h1{font-size:2.4rem;font-weight:900;letter-spacing:2px;position:relative;}
.hero h1 span{background:linear-gradient(90deg,var(--primary),#F7C948);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}
.hero-sub{opacity:0.8;font-size:1rem;margin-top:0.3rem;font-weight:300;position:relative;}
.stats-row{display:flex;justify-content:center;gap:1rem;margin-top:1.2rem;flex-wrap:wrap;position:relative;}
.stat-chip{background:rgba(255,255,255,0.1);backdrop-filter:var(--blur);border:1px solid rgba(255,255,255,0.15);padding:0.35rem 1rem;border-radius:999px;font-size:0.82rem;font-weight:500;}

/* ── Layout ── */
.container{max-width:1280px;margin:0 auto;padding:0 1rem;}

/* ── Search ── */
.search-wrap{position:relative;margin:-1.5rem auto 0;max-width:720px;z-index:20;padding:0 1rem;}
.search-input{width:100%;padding:1rem 1.2rem 1rem 3rem;border:none;border-radius:var(--radius);background:var(--card);box-shadow:0 8px 32px rgba(0,0,0,0.1);font-size:1rem;outline:none;transition:box-shadow .3s;}
.search-input:focus{box-shadow:0 8px 40px rgba(255,107,53,0.18);}
.search-icon{position:absolute;left:2rem;top:50%;transform:translateY(-50%);font-size:1.1rem;color:var(--text-sec);pointer-events:none;}

/* ── Filters ── */
.filter-panel{margin-top:1.2rem;padding:1.2rem;background:var(--card);border-radius:var(--radius);box-shadow:var(--shadow);}
.filter-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:0.6rem;}
.filter-title{font-weight:700;font-size:0.92rem;color:var(--text);}
.clear-btn{background:none;border:none;color:var(--primary);cursor:pointer;font-size:0.82rem;font-weight:500;}
.clear-btn:hover{text-decoration:underline;}
.filter-group{margin-bottom:0.7rem;}
.filter-label{font-size:0.78rem;font-weight:600;color:var(--text-sec);text-transform:uppercase;letter-spacing:1px;margin-bottom:0.35rem;display:block;}
.pills{display:flex;flex-wrap:wrap;gap:6px;}
.pill{padding:0.3rem 0.7rem;border:1.5px solid var(--border);border-radius:999px;background:transparent;cursor:pointer;font-size:0.78rem;font-weight:500;color:var(--text-sec);transition:all .2s;white-space:nowrap;}
.pill:hover{border-color:var(--primary);color:var(--primary);}
.pill.on{background:var(--primary);color:#fff;border-color:var(--primary);}
.pill.r-north.on{background:var(--north);border-color:var(--north);}
.pill.r-central.on{background:var(--central);border-color:var(--central);}
.pill.r-south.on{background:var(--south);border-color:var(--south);}
.pill.r-east.on{background:var(--east);border-color:var(--east);}
.pill.r-island.on{background:var(--island);border-color:var(--island);}

.sort-bar{display:flex;align-items:center;gap:0.6rem;margin-top:0.5rem;}
.sort-bar label{font-size:0.78rem;font-weight:600;color:var(--text-sec);}
.sort-select{padding:0.3rem 0.6rem;border:1.5px solid var(--border);border-radius:var(--radius-sm);font-size:0.8rem;background:#fff;outline:none;}

/* ── View Toggle ── */
.view-bar{display:flex;justify-content:space-between;align-items:center;margin:1rem 0 0.6rem;}
.view-toggle{display:flex;background:var(--card);border-radius:var(--radius-sm);overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.06);}
.view-btn{padding:0.5rem 1.1rem;border:none;background:transparent;cursor:pointer;font-size:0.85rem;font-weight:600;color:var(--text-sec);transition:all .2s;}
.view-btn.active{background:var(--primary);color:#fff;}
.results-count{font-size:0.85rem;color:var(--text-sec);font-weight:500;}

/* ── Tabs ── */
.tabs{display:flex;gap:0;background:var(--card);border-radius:var(--radius-sm);overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,0.06);margin-bottom:1rem;}
.tab-btn{flex:1;padding:0.65rem;border:none;background:transparent;cursor:pointer;font-size:0.88rem;font-weight:600;color:var(--text-sec);transition:all .2s;text-align:center;}
.tab-btn.active{background:var(--text);color:#fff;}

/* ── Map ── */
#mapView{width:100%;height:520px;border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow);margin-bottom:1.2rem;display:none;}
#mapView.show{display:block;}

/* ── Cards Grid ── */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:1rem;padding-bottom:2rem;}
@media(max-width:720px){.grid{grid-template-columns:1fr;}}

/* ── Card ── */
.card{background:var(--card);border-radius:var(--radius);padding:1.3rem;box-shadow:0 2px 12px rgba(0,0,0,0.04);border-top:3px solid var(--border);transition:transform .25s,box-shadow .25s;position:relative;overflow:hidden;}
.card::after{content:'';position:absolute;top:0;left:0;right:0;height:3px;opacity:0;transition:opacity .25s;}
.card:hover{transform:translateY(-4px);box-shadow:0 12px 36px rgba(0,0,0,0.1);}
.card:hover::after{opacity:1;}
.card.north{border-top-color:var(--north);}.card.north::after{background:var(--north);}
.card.central{border-top-color:var(--central);}.card.central::after{background:var(--central);}
.card.south{border-top-color:var(--south);}.card.south::after{background:var(--south);}
.card.east{border-top-color:var(--east);}.card.east::after{background:var(--east);}
.card.island{border-top-color:var(--island);}.card.island::after{background:var(--island);}

.card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:0.5rem;}
.card-name{font-size:1.05rem;font-weight:700;line-height:1.3;}
.rating-badge{flex-shrink:0;background:linear-gradient(135deg,#FDE68A,#FCD34D);color:#92400E;padding:0.2rem 0.55rem;border-radius:8px;font-size:0.78rem;font-weight:700;display:flex;align-items:center;gap:3px;}
.rating-badge svg{width:12px;height:12px;fill:#92400E;}

.card-desc{font-size:0.85rem;color:var(--text-sec);margin:0.45rem 0 0.6rem;line-height:1.5;}

.tag-row{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:0.6rem;}
.tag{padding:0.18rem 0.55rem;border-radius:6px;font-size:0.72rem;font-weight:600;letter-spacing:0.3px;}
.tag-region{color:#fff;}
.tag-region.north{background:var(--north);}.tag-region.central{background:var(--central);}
.tag-region.south{background:var(--south);}.tag-region.east{background:var(--east);}.tag-region.island{background:var(--island);}
.tag-cuisine{background:#ECFDF5;color:#065F46;}
.tag-price{background:#FEF3C7;color:#92400E;}
.tag-audience{background:#EFF6FF;color:#1E40AF;}

.card-info{font-size:0.8rem;color:var(--text-sec);margin-bottom:0.5rem;display:flex;flex-wrap:wrap;gap:0.6rem;}
.card-info span{display:flex;align-items:center;gap:3px;}

.card-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto;}
.action-btn{display:inline-flex;align-items:center;gap:4px;padding:0.35rem 0.7rem;border-radius:8px;font-size:0.76rem;font-weight:600;text-decoration:none;transition:all .2s;}
.action-btn:hover{transform:scale(1.03);}
.btn-maps{background:#4285F4;color:#fff;}
.btn-review{background:var(--primary);color:#fff;}

/* ── Platform & Blogger ── */
.pf-card{background:var(--card);border-radius:var(--radius);padding:1.3rem;box-shadow:0 2px 12px rgba(0,0,0,0.04);border-left:4px solid #F59E0B;transition:transform .25s,box-shadow .25s;}
.pf-card:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(0,0,0,0.08);}
.pf-card .card-name{color:#D97706;}
.pf-type{background:#FFFBEB;color:#B45309;padding:0.15rem 0.5rem;border-radius:6px;font-size:0.75rem;font-weight:600;}
.pf-features{font-size:0.82rem;color:var(--text-sec);margin:0.4rem 0;}
.pf-link{display:inline-flex;align-items:center;gap:4px;padding:0.38rem 0.8rem;background:linear-gradient(135deg,#F59E0B,#D97706);color:#fff;border-radius:8px;text-decoration:none;font-size:0.8rem;font-weight:600;transition:transform .2s;}
.pf-link:hover{transform:scale(1.03);}

.bl-card{background:var(--card);border-radius:var(--radius);padding:1.3rem;box-shadow:0 2px 12px rgba(0,0,0,0.04);border-left:4px solid var(--east);transition:transform .25s,box-shadow .25s;}
.bl-card:hover{transform:translateY(-3px);box-shadow:0 8px 28px rgba(0,0,0,0.08);}
.bl-card .card-name{color:var(--east);}
.bl-plat{background:#F5F3FF;color:#6D28D9;padding:0.15rem 0.5rem;border-radius:6px;font-size:0.75rem;font-weight:600;}

/* ── Footer ── */
footer{text-align:center;padding:2.5rem 1rem;color:var(--text-sec);font-size:0.82rem;border-top:1px solid var(--border);margin-top:1rem;background:var(--card);}
footer a{color:var(--primary);text-decoration:none;}

/* ── Leaflet popup ── */
.leaflet-popup-content-wrapper{border-radius:12px!important;box-shadow:0 8px 28px rgba(0,0,0,0.12)!important;}
.leaflet-popup-content{margin:10px 14px!important;font-family:'Noto Sans TC',sans-serif!important;line-height:1.5!important;}
.popup-name{font-weight:700;font-size:0.95rem;margin-bottom:4px;}
.popup-meta{font-size:0.8rem;color:#6B7280;}
.popup-tags{display:flex;gap:4px;margin:6px 0;}
.popup-link{display:inline-block;margin-top:6px;padding:4px 10px;background:#4285F4;color:#fff;border-radius:6px;font-size:0.75rem;text-decoration:none;font-weight:600;}

/* ── Animations ── */
@keyframes fadeUp{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.card,.pf-card,.bl-card{animation:fadeUp .4s ease both;}

/* ── Mobile ── */
@media(max-width:600px){
  .hero h1{font-size:1.6rem;}
  .stats-row{gap:0.5rem;}
  .stat-chip{font-size:0.75rem;padding:0.25rem 0.7rem;}
  #mapView{height:360px;}
}
</style>
</head>

    <div class="sort-bar">
      <label>排序</label>
      <select class="sort-select" id="sortSel">
        <option value="rating-desc">評分高→低</option>

        <option value="region">依區域</option>

  </div>

  <!-- Tabs -->
  <div style="margin-top:1rem;">
    <div class="tabs">
      <button class="tab-btn active" data-tab="restaurants">餐廳推薦</button>
      <button class="tab-btn" data-tab="platforms">美食平台</button>
      <button class="tab-btn" data-tab="bloggers">美食創作者</button>
    </div>
  </div>

  <!-- View Toggle -->
  <div class="view-bar" id="viewBar">
    <div class="view-toggle">
      <button class="view-btn active" data-view="list">列表</button>
      <button class="view-btn" data-view="map">地圖</button>
    </div>
    <span class="results-count" id="resultsCount"></span>
  </div>

  <!-- Map -->
  <div id="mapView"></div>

  <!-- Grid -->
  <div class="grid" id="mainGrid"></div>
</div>

<footer>
  <p><strong>台灣美食地圖</strong> — 資料來源：愛食記 · 窩客島 · Google Maps · 米其林指南 · 食尚玩家 · Dcard · PTT</p>
  <p style="margin-top:0.3rem;">最後更新 2026-04-17 ｜ 實際營業資訊請以店家公告為準</p>
</footer>

}

const regionColors = {north:'#2563EB',central:'#059669',south:'#DC2626',east:'#7C3AED',island:'#0891B2'};
let filters = {region:[],cuisine:[],audience:[],price:[]};
let search = '';
let currentTab = 'restaurants';
let currentView = 'list';
let map = null;
let markers = [];

/* ================================================================
   INIT
   ================================================================ */
function init(){
  // build dynamic pills
  const cuisines = [...new Set(restaurants.map(r=>r.cuisine))].sort();
  const auds = new Set(); restaurants.forEach(r=>r.audience.split(/[、,]/).forEach(a=>auds.add(a.trim())));
  buildPills('cuisinePills',cuisines,'cuisine');
  buildPills('audiencePills',[...auds].sort(),'audience');

  // events
  document.querySelectorAll('.pill[data-f]').forEach(p=>p.addEventListener('click',()=>toggle(p)));
  document.getElementById('searchInput').addEventListener('input',e=>{search=e.target.value.trim().toLowerCase();render();});
  document.getElementById('sortSel').addEventListener('change',()=>render());
  document.querySelectorAll('.tab-btn').forEach(t=>t.addEventListener('click',()=>{
    document.querySelectorAll('.tab-btn').forEach(x=>x.classList.remove('active'));
    t.classList.add('active'); currentTab=t.dataset.tab; render();
  }));
  document.querySelectorAll('.view-btn').forEach(v=>v.addEventListener('click',()=>{
    document.querySelectorAll('.view-btn').forEach(x=>x.classList.remove('active'));
    v.classList.add('active'); currentView=v.dataset.view; render();
  }));
  updateStats(); render();
}

function buildPills(id,items,filterKey){
  const c=document.getElementById(id);
  items.forEach(v=>{const b=document.createElement('button');b.className='pill';b.dataset.f=filterKey;b.dataset.v=v;b.textContent=v;b.addEventListener('click',()=>toggle(b));c.appendChild(b);});
}

function toggle(btn){
  const f=btn.dataset.f,v=btn.dataset.v;
  btn.classList.toggle('on');
  filters[f]=filters[f].includes(v)?filters[f].filter(x=>x!==v):[...filters[f],v];
  render();
}

function clearAll(){
  Object.keys(filters).forEach(k=>filters[k]=[]);
  document.querySelectorAll('.pill.on').forEach(p=>p.classList.remove('on'));
  document.getElementById('searchInput').value='';search='';render();
}

function rc(r){return{'\u5317\u90e8':'north','\u4e2d\u90e8':'central','\u5357\u90e8':'south','\u6771\u90e8':'east','\u96e2\u5cf6':'island'}[r]||'island';}
function priceLevel(p){if(p.includes('\u4ee5\u4e0b'))return 1;if(p.includes('100-300'))return 2;if(p.includes('300-600'))return 3;if(p.includes('600-1000'))return 4;return 5;}

function filtered(){
  return restaurants.filter(r=>{
    if(search){const s=search;if(![r.name,r.cuisine,r.audience,r.city,r.district,r.description,r.region,r.source].some(f=>f&&f.toLowerCase().includes(s)))return false;}
    if(filters.region.length&&!filters.region.includes(r.region))return false;
    if(filters.cuisine.length&&!filters.cuisine.includes(r.cuisine))return false;
    if(filters.audience.length){const a=r.audience.split(/[、,]/).map(x=>x.trim());if(!filters.audience.some(x=>a.includes(x)))return false;}
    if(filters.price.length&&!filters.price.includes(r.price_range))return false;
    return true;
  });
}

function sorted(list){
  const s=document.getElementById('sortSel').value;
  return[...list].sort((a,b)=>{
    if(s==='name')return a.name.localeCompare(b.name,'zh-TW');
    if(s==='rating-desc')return(b.rating||0)-(a.rating||0);
    if(s==='price-asc')return priceLevel(a.price_range)-priceLevel(b.price_range);
    if(s==='price-desc')return priceLevel(b.price_range)-priceLevel(a.price_range);
    if(s==='region')return a.region.localeCompare(b.region);
    return 0;
  });
}

function updateStats(){
  document.getElementById('statTotal').textContent=restaurants.length+' 間餐廳';
  document.getElementById('statCuisine').textContent=new Set(restaurants.map(r=>r.cuisine)).size+' 種料理';
}

/* ================================================================
   MAP
   ================================================================ */
function initMap(){
  if(map)return;
  map=L.map('mapView',{zoomControl:true,scrollWheelZoom:true}).setView([23.7,120.96],7.5);
  L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',{
    attribution:'&copy; <a href="https://carto.com/">CARTO</a>',maxZoom:18
  }).addTo(map);
}

function updateMapMarkers(data){
  markers.forEach(m=>map.removeLayer(m));markers=[];
  data.forEach((r,i)=>{
    const ll=getLL(r,i);
    const color=regionColors[rc(r.region)]||'#666';
    const icon=L.divIcon({className:'',html:`<div style="width:28px;height:28px;background:${color};border:3px solid #fff;border-radius:50%;box-shadow:0 2px 8px rgba(0,0,0,0.25);display:flex;align-items:center;justify-content:center;font-size:12px;color:#fff;font-weight:700;">${r.rating||''}</div>`,iconSize:[28,28],iconAnchor:[14,14]});
    const m=L.marker(ll,{icon}).addTo(map);
    m.bindPopup(`<div class="popup-name">${r.name}</div><div class="popup-tags"><span class="tag tag-region ${rc(r.region)}" style="color:#fff;padding:2px 6px;border-radius:4px;font-size:11px;background:${color}">${r.region}</span><span style="background:#ECFDF5;color:#065F46;padding:2px 6px;border-radius:4px;font-size:11px;">${r.cuisine}</span><span style="background:#FEF3C7;color:#92400E;padding:2px 6px;border-radius:4px;font-size:11px;">${r.price_range}</span></div><div class="popup-meta">${r.city} ${r.district}<br>${r.description}</div>${r.google_maps_url?`<a class="popup-link" href="${r.google_maps_url}" target="_blank">Google Maps</a>`:''} ${r.review_url?`<a class="popup-link" href="${r.review_url}" target="_blank" style="background:#FF6B35;">食記</a>`:''}`,{maxWidth:280});
    markers.push(m);
  });
  if(data.length){const g=L.featureGroup(markers);map.fitBounds(g.getBounds().pad(0.1));}
}

/* ================================================================
   RENDER
   ================================================================ */
function render(){
  const grid=document.getElementById('mainGrid');
  const info=document.getElementById('resultsCount');
  const mapEl=document.getElementById('mapView');
  const vBar=document.getElementById('viewBar');
  grid.innerHTML='';

  // show/hide view toggle only for restaurants
  vBar.style.display=(currentTab==='restaurants')?'flex':'none';

  if(currentTab==='restaurants'){
    const data=sorted(filtered());
    info.textContent=`${data.length} / ${restaurants.length} 筆`;

    if(currentView==='map'){
      mapEl.classList.add('show');
      grid.style.display='none';
      initMap();
      setTimeout(()=>{map.invalidateSize();updateMapMarkers(data);},100);
    } else {
      mapEl.classList.remove('show');
      grid.style.display='grid';
      data.forEach((r,i)=>{
        const c=rc(r.region);
        grid.innerHTML+=`<div class="card ${c}" style="animation-delay:${Math.min(i*0.03,0.6)}s">
          <div class="card-top"><span class="card-name">${r.name}</span>${r.rating?`<span class="rating-badge"><svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87L18.18 22 12 18.27 5.82 22 7 14.14l-5-4.87 6.91-1.01z"/></svg>${r.rating}</span>`:''}</div>
          <div class="card-desc">${r.description}</div>
          <div class="tag-row"><span class="tag tag-region ${c}">${r.region}</span><span class="tag tag-cuisine">${r.cuisine}</span><span class="tag tag-price">${r.price_range}</span></div>
          <div class="card-info"><span>${r.city} ${r.district}</span><span>${r.audience}</span></div>
          <div class="card-info"><span>${r.source}</span></div>
          <div class="card-actions">${r.google_maps_url?`<a class="action-btn btn-maps" href="${r.google_maps_url}" target="_blank">Google Maps</a>`:''} ${r.review_url?`<a class="action-btn btn-review" href="${r.review_url}" target="_blank">食記</a>`:''}</div>
        </div>`;
      });
    }
  } else if(currentTab==='platforms'){
    mapEl.classList.remove('show');grid.style.display='grid';
    info.textContent=`${platforms.length} 個平台`;
    platforms.forEach((p,i)=>{
      grid.innerHTML+=`<div class="pf-card" style="animation-delay:${i*0.04}s"><div class="card-top"><span class="card-name">${p.name}</span><span class="pf-type">${p.type}</span></div><div class="card-desc">${p.description}</div><div class="pf-features">${p.features}</div><div class="card-info"><span>${p.coverage}</span></div><a class="pf-link" href="${p.url}" target="_blank">前往平台 &rarr;</a></div>`;
    });
  } else {
    mapEl.classList.remove('show');grid.style.display='grid';
    info.textContent=`${bloggers.length} 位創作者`;
    bloggers.forEach((b,i)=>{
      grid.innerHTML+=`<div class="bl-card" style="animation-delay:${i*0.04}s"><div class="card-top"><span class="card-name">${b.name}</span><span class="bl-plat">${b.platform}</span></div><div class="card-desc">${b.description}</div><div class="card-info"><span>${b.subscribers} 訂閱</span><span>${b.specialty}</span></div></div>`;
    });
  }
}

init();
</script>
</body>
</html>
